[project]
name = "aqua-self-pruning"
version = "0.1.0"
description = "A from-scratch NumPy autodiff engine and self-pruning network."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aqua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
